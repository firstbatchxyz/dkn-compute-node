[package]
name = "dria-node"
version = "0.7.4"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "dria-node"
path = "src/main.rs"

[features]
default = []
# Inference-engine deps (Luminal model graph + safetensors weight loading); enabled by a backend.
engine = ["dep:luminal_nn", "dep:hf-hub", "dep:safetensors", "dep:half", "dep:bytemuck", "dep:memmap2"]
# Backend selectors: pull in the Luminal backend crate (+ the engine deps) for the accelerator.
cuda = ["dep:luminal_cuda_lite", "engine"]
metal = ["dep:luminal_metal", "engine"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
libsecp256k1 = "0.7"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
dialoguer = "0.11"
dirs = "6"
encoding_rs = "0.8"
dkn-protocol = { git = "https://github.com/firstbatchxyz/dkn-protocol.git", branch = "main" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rcgen = "0.13"
futures = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
self-replace = "1"
tempfile = "3"

# Compute substrate: Luminal, pinned to the validated upstream rev. crates.io ships the
# older pre-egglog-rewrite release, so we use git. The core graph lib is always built;
# the backend crates are optional, selected by the cuda/metal features.
# See docs/substrate-decision.md.
luminal = { git = "https://github.com/jafioti/luminal", rev = "497b1aad9b7af7db7efeb93b46845d9f8f8919cd" }
luminal_metal = { git = "https://github.com/jafioti/luminal", rev = "497b1aad9b7af7db7efeb93b46845d9f8f8919cd", optional = true }
luminal_cuda_lite = { git = "https://github.com/jafioti/luminal", rev = "497b1aad9b7af7db7efeb93b46845d9f8f8919cd", optional = true }
luminal_nn = { git = "https://github.com/jafioti/luminal", rev = "497b1aad9b7af7db7efeb93b46845d9f8f8919cd", optional = true }

# Model weight loading (qwen/glm safetensors → bf16), behind the `engine` feature.
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"], optional = true }
safetensors = { version = "0.7", optional = true }
half = { version = "2.7", features = ["bytemuck"], optional = true }
bytemuck = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
